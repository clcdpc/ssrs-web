name: Deploy independently approved SSRS Web DEV release
on:
  workflow_dispatch:
    inputs:
      authorization_id:
        description: Independently provisioned protected host inspection/setup authorization ID
        required: true
        type: string
      release_approval_id:
        description: Independently provisioned protected application release approval ID
        required: true
        type: string
      first_cutover:
        description: Explicit independently authorized stopped first cutover (ordinary deployment uses false)
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: ssrs-web-dev
  cancel-in-progress: false
jobs:
  admission:
    runs-on: windows-2022
    timeout-minutes: 5
    outputs:
      admitted: ${{ steps.check.outputs.admitted }}
    steps:
      - name: Check independent activation prerequisites without routing an elevated job
        id: check
        shell: pwsh -NoLogo -NoProfile -NonInteractive -File "{0}"
        env:
          DEPLOYMENT_ENABLED: ${{ vars.SSRS_DEV_DEPLOYMENT_ENABLED }}
          RUNNER_ADMISSION_READY: ${{ vars.SSRS_DEV_RUNNER_ADMISSION_READY }}
          RUNNER_GROUP: ${{ vars.SSRS_DEV_RUNNER_GROUP }}
          RUNNER_LABELS: ${{ vars.SSRS_DEV_RUNNER_LABELS }}
        run: |
          $ErrorActionPreference='Stop'
          if ($env:GITHUB_REPOSITORY -cne 'clcdpc/ssrs-web' -or $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $env:GITHUB_REF -cne 'refs/heads/master' -or $env:GITHUB_REF_PROTECTED -cne 'true' -or $env:GITHUB_WORKFLOW_SHA -cne $env:GITHUB_SHA) { throw 'Ssrs.TrustedWorkflowRequired' }
          if ($env:DEPLOYMENT_ENABLED -cne 'true') { throw 'Ssrs.Prerequisite.DeploymentActivationDisabled' }
          if ($env:RUNNER_ADMISSION_READY -cne 'true' -or [string]::IsNullOrWhiteSpace($env:RUNNER_GROUP)) { throw 'Ssrs.Prerequisite.RestrictedRunnerGroupRequired' }
          $labels=ConvertFrom-Json $env:RUNNER_LABELS -NoEnumerate
          if ($labels -isnot [array] -or $labels.Count -eq 0 -or @($labels | Where-Object { $_ -isnot [string] -or [string]::IsNullOrWhiteSpace($_) }).Count) { throw 'Ssrs.Prerequisite.ProvisionedRunnerLabelsRequired' }
          'admitted=true' | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (Test-Path -LiteralPath variable:\LASTEXITCODE) { exit $LASTEXITCODE }
  deploy:
    needs: admission
    # THIS GUARD AND LABELS ARE NOT A SECURITY BOUNDARY. Before registration,
    # infrastructure MUST restrict the runner group to this directly defined
    # workflow at clcdpc/ssrs-web/.github/workflows/deploy-dev.yml@refs/heads/master.
    if: needs.admission.outputs.admitted == 'true' && github.ref == 'refs/heads/master' && github.ref_protected
    runs-on:
      group: ${{ vars.SSRS_DEV_RUNNER_GROUP }}
      labels: ${{ fromJSON(vars.SSRS_DEV_RUNNER_LABELS || '[]') }}
    environment: ssrs-web-dev
    timeout-minutes: 60
    steps:
      # No checkout, build, npm, downloaded application script or database setup.
      - name: Run authenticated toolkit enrollment and approved file deployment
        id: deployment
        shell: C:\CLC\Tools\PowerShell\7.6.6\pwsh.exe -NoLogo -NoProfile -NonInteractive -CommandWithArgs "& ([System.Management.Automation.ScriptBlock]::Create([System.IO.File]::ReadAllText($args[0])))" "{0}"
        env:
          SSRS_DEV_ENABLED: ${{ vars.SSRS_DEV_DEPLOYMENT_ENABLED }}
          SSRS_EXTERNAL_RUNNER_ADMISSION: ${{ vars.SSRS_DEV_RUNNER_ADMISSION_READY }}
          SSRS_AUTHORIZATION_ID: ${{ inputs.authorization_id }}
          SSRS_RELEASE_APPROVAL_ID: ${{ inputs.release_approval_id }}
          SSRS_FIRST_CUTOVER: ${{ inputs.first_cutover }}
          SSRS_ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference='Stop'
          # Load deployment code only from this protected-master workflow revision.
          if ($env:GITHUB_REPOSITORY -cne 'clcdpc/ssrs-web' -or $env:GITHUB_REF -cne 'refs/heads/master' -or $env:GITHUB_REF_PROTECTED -cne 'true' -or $env:GITHUB_WORKFLOW_SHA -cne $env:GITHUB_SHA -or $env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$') { throw 'Ssrs.TrustedWorkflowRequired' }
          $handler=[Net.Http.HttpClientHandler]::new(); $handler.AllowAutoRedirect=$false; $handler.UseCookies=$false
          $client=[Net.Http.HttpClient]::new($handler); $client.Timeout=[TimeSpan]::FromSeconds(60)
          try {
              $client.DefaultRequestHeaders.UserAgent.ParseAdd('ssrs-web-trusted-deployment/1')
              $client.DefaultRequestHeaders.Authorization=[Net.Http.Headers.AuthenticationHeaderValue]::new('Bearer',$env:SSRS_ARTIFACT_READ_TOKEN)
              $uri='https://api.github.com/repos/clcdpc/ssrs-web/contents/scripts/release/Deployment.Common.ps1?ref='+$env:GITHUB_WORKFLOW_SHA
              $response=$client.GetAsync($uri).GetAwaiter().GetResult()
              try {
                  $response.EnsureSuccessStatusCode() | Out-Null
                  if ($response.Content.Headers.ContentLength -gt 1048576) { throw 'Ssrs.TrustedScriptBound' }
                  $record=ConvertFrom-Json ($response.Content.ReadAsStringAsync().GetAwaiter().GetResult())
                  if ($record.type -cne 'file' -or $record.path -cne 'scripts/release/Deployment.Common.ps1' -or $record.encoding -cne 'base64' -or $record.size -gt 1048576) { throw 'Ssrs.TrustedScriptRequired' }
                  $bytes=[Convert]::FromBase64String($record.content)
                  $prefix=[Text.Encoding]::UTF8.GetBytes('blob '+$bytes.Length+[char]0)
                  $hash=[Convert]::ToHexString([Security.Cryptography.SHA1]::HashData([byte[]]($prefix+$bytes))).ToLowerInvariant()
                  if ($hash -cne $record.sha -or $bytes.Length -ne $record.size) { throw 'Ssrs.TrustedScriptMismatch' }
                  . ([ScriptBlock]::Create([Text.UTF8Encoding]::new($false,$true).GetString($bytes)))
              } finally { $response.Dispose() }
          } finally { $client.Dispose(); $handler.Dispose() }
          # SSRS-DEV-ENTRYPOINT
          $evidence=New-SsrsEvidence; $bootstrap=$null; $failed=$false
          try {
              Assert-SsrsContext
              $bootstrap=Open-SsrsBootstrap $env:SSRS_AUTHORIZATION_ID
              # Dot-source only the already independently authenticated protected helpers.
              . (Join-Path $bootstrap.root 'tools/host/HostEnrollment.Common.ps1')
              $null=Invoke-SsrsDevCore $bootstrap $env:SSRS_AUTHORIZATION_ID $env:SSRS_RELEASE_APPROVAL_ID ($env:SSRS_FIRST_CUTOVER -ceq 'true') $evidence
          } catch { $failed=$true; Set-SsrsSafeFailure $evidence $_ }
          finally {
              if ($bootstrap) { foreach ($lease in $bootstrap.leases) { $lease.Dispose() } }
              $json=$evidence | ConvertTo-Json -Depth 6 -Compress
              Write-Output $json
              if ($env:GITHUB_OUTPUT -and $env:RUNNER_TEMP) {
                  $path=Join-Path $env:RUNNER_TEMP ('ssrs-deployment-'+[Guid]::NewGuid().ToString('N')+'.json')
                  $file=[IO.FileStream]::new($path,[IO.FileMode]::CreateNew,[IO.FileAccess]::Write,[IO.FileShare]::None)
                  try { $file.Write([Text.Encoding]::UTF8.GetBytes($json)); $file.Flush($true) } finally { $file.Dispose() }
                  "evidence-path=$path" | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
              }
          }
          if ($failed) { exit 1 }
          if (Test-Path -LiteralPath variable:\LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Retain only whitelisted deployment evidence
        if: always() && steps.deployment.outputs.evidence-path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ssrs-web-dev-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.deployment.outputs.evidence-path }}
          if-no-files-found: error
          retention-days: 30
