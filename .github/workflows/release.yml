name: Release and deploy SSRS Web tag
on:
  push:
    tags: ['v*']
permissions: {}
jobs:
  package:
    if: github.repository == 'clcdpc/ssrs-web'
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      attempt: ${{ steps.source.outputs.attempt }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE: 'false'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: clcdpc/clc-deployment
          ref: 7fcfd03da044655b57fe47d55e234571bef035bd
          path: artifacts/clc-deployment
          persist-credentials: false
      - name: Verify the exact tag and producer source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $configurationPath = Join-Path $PWD '.clc/release.json'
          $pin = (Get-Content -LiteralPath $configurationPath -Raw | ConvertFrom-Json).orchestration.sharedRevision
          $head = git rev-parse HEAD
          $toolkitHead = git -C artifacts/clc-deployment rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $toolkitHead -cne $pin -or $head -cne $env:GITHUB_SHA -or
              $env:GITHUB_WORKFLOW_SHA -cne $env:GITHUB_SHA -or $env:GITHUB_EVENT_NAME -cne 'push' -or $env:GITHUB_REF_TYPE -cne 'tag') {
              throw 'The workflow, source and toolkit must match their selected immutable revisions.'
          }
          . ./artifacts/clc-deployment/tools/release/Workflow.Common.ps1
          $config = Read-ClcConsumerConfiguration $configurationPath
          if ($config.repository -cne $env:GITHUB_REPOSITORY -or $config.producer.job -cne $env:GITHUB_JOB -or
              $env:GITHUB_WORKFLOW_REF -cne ($config.repository + '/' + $config.producer.workflowPath + '@' + $env:GITHUB_REF)) {
              throw 'The tagged workflow is not the configured release producer.'
          }
          $api = { param($method, $path, $body) Invoke-ClcReleaseApi -Repository $config.repository -Method $method -Path $path -Body $body }
          $null = Get-ClcVerifiedSource $config $env:GITHUB_REF_NAME $env:GITHUB_SHA ([long]$env:GITHUB_RUN_ID) $api
          "attempt=$env:GITHUB_RUN_ATTEMPT" >> $env:GITHUB_OUTPUT
      - name: Read the exact SDK version and isolate its installation
        id: sdk
        run: |
          "DOTNET_INSTALL_DIR=$env:RUNNER_TEMP/ssrs-dotnet" >> $env:GITHUB_ENV
          $version = (Get-Content -LiteralPath global.json -Raw | ConvertFrom-Json).sdk.version
          "version=$version" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}
      - name: Select the pinned packaging PowerShell
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'ssrs-build-tools'
          ./scripts/release/Initialize-ToolkitTestTools.ps1 -ToolkitRoot artifacts/clc-deployment -Destination $tools -PackagingOnly
          (Join-Path $tools 'pwsh') >> $env:GITHUB_PATH
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Restore and qualify the application
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet restore SsrsPortal.slnx --locked-mode
          dotnet build SsrsPortal.slnx -c Release --no-restore
          dotnet test SsrsPortal.slnx -c Release --no-build --logger 'console;verbosity=minimal'
          node --test scripts/check-generated-artifacts.test.cjs
          node scripts/check-generated-artifacts.cjs
          npm ci
          npm audit --audit-level=low
      - name: Verify the operational configuration publish guard
        run: ./scripts/Test-ConfigurationPublishGuard.ps1
      - name: Qualify synthetic browser behavior
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ssrs-playwright
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npx --no-install playwright install chromium
          ./scripts/Test-Portal.ps1 -BrowserExecutable ''
          $env:PORTAL_BROWSER_SUITE = 'subscriptions'
          ./scripts/Test-Portal.ps1 -BrowserExecutable ''
          dotnet run --project tests/SsrsPortal.BrowserChecks -c Release --no-build -- .
      - name: Publish and verify the tagged application
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # The toolkit needs NTFS for the publish and release ZIP.
          $root = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) "ssrs-package-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $null = New-Item -ItemType Directory -Path $root
          "CLC_PACKAGE_ROOT=$root" >> $env:GITHUB_ENV
          $ordinary = Join-Path $root 'ordinary-publish'
          $publish = Join-Path $root 'qualified-publish'
          dotnet publish src/SsrsPortal/SsrsPortal.csproj -c Release --no-build --no-restore --output $ordinary
          ./scripts/release/Publish-QualifiedPortal.ps1 -ToolkitRoot artifacts/clc-deployment -Tag $env:GITHUB_REF_NAME -SourceCommit $env:GITHUB_SHA `
              -PublishDirectory $publish -OrdinaryPublishDirectory $ordinary
          $admin = Join-Path $env:RUNNER_TEMP 'administrative-setup.zip'
          $null = ./scripts/release/New-SubscriptionSetupArtifact.ps1 -OutputPath $admin -SourceCommit $env:GITHUB_SHA
          ./scripts/release/Test-SubscriptionPublish.ps1 -PublishDirectory $publish -AdministrationArchive $admin
      - name: Build the qualified release package
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $sdk = (dotnet --version).Trim()
          $pin = (Get-Content -LiteralPath .clc/release.json -Raw | ConvertFrom-Json).orchestration.sharedRevision
          # The beta.6 prequalified entry point calls this path helper before importing the module.
          . ./artifacts/clc-deployment/src/Clc.Deployment/Private/Paths.ps1
          ./artifacts/clc-deployment/tools/release/New-ClcApplicationPackage.ps1 `
              -ConfigurationPath .clc/release.json -SourceRoot $PWD.Path -Reference $env:GITHUB_REF_NAME -SourceCommit $env:GITHUB_SHA `
              -SharedSourceCommit $pin -RunId ([long]$env:GITHUB_RUN_ID) -RunAttempt ([long]$env:GITHUB_RUN_ATTEMPT) `
              -QualifiedPublishRoot (Join-Path $env:CLC_PACKAGE_ROOT 'qualified-publish') -SdkVersion $sdk -ValidationEntryPoint SsrsPortal.dll `
              -OutputDirectory (Join-Path $env:CLC_PACKAGE_ROOT 'shared-package')
      - name: Upload the qualified release package
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_path }}/release.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload separate subscription setup tooling
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ssrs-web-administrative-setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/administrative-setup.zip
          if-no-files-found: error
          retention-days: 30
  publication:
    needs: package
    permissions:
      contents: write
      actions: read
      id-token: write
    uses: clcdpc/clc-deployment/.github/workflows/application-release.yml@7fcfd03da044655b57fe47d55e234571bef035bd
    with:
      reference: ${{ github.ref_name }}
      source-commit: ${{ github.sha }}
      producer-run-id: ${{ fromJSON(github.run_id) }}
      producer-run-attempt: ${{ fromJSON(needs.package.outputs.attempt) }}
      artifact-id: ${{ fromJSON(needs.package.outputs.artifact-id) }}
  deployment:
    needs: [package, publication]
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: clcdpc/clc-deployment/.github/workflows/application-deploy.yml@7fcfd03da044655b57fe47d55e234571bef035bd
    with:
      reference: ${{ github.ref_name }}
      source-commit: ${{ github.sha }}
      producer-run-id: ${{ fromJSON(github.run_id) }}
      producer-run-attempt: ${{ fromJSON(needs.package.outputs.attempt) }}
      artifact-id: ${{ fromJSON(needs.package.outputs.artifact-id) }}
