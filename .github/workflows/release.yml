name: Produce immutable SSRS Web release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: ssrs-web-release-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  release:
    # Hosted production only. The master-owned consumer authenticates this producer.
    if: github.repository == 'clcdpc/ssrs-web'
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Require exact immutable selection
        env:
          SELECTED_COMMIT: ${{ github.sha }}
        run: |
          if ($env:SELECTED_COMMIT -cnotmatch '^[a-f0-9]{40}$' -or $env:SELECTED_COMMIT -cne $env:GITHUB_SHA -or $env:GITHUB_WORKFLOW_SHA -cne $env:GITHUB_SHA -or $env:GITHUB_REF_TYPE -cne 'tag') { throw 'Release.ExactWorkflowSourceRequired' }
      - name: Isolate exact-byte checkout settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inheritedGitEnvironment = @(Get-ChildItem Env: | Where-Object { $_.Name -like 'GIT_*' })
          if ($inheritedGitEnvironment.Count -gt 0) { throw 'Release.CheckoutEnvironmentAmbiguous' }
          $isolatedConfig = Join-Path $env:RUNNER_TEMP 'ssrs-web-release-empty-gitconfig'
          $isolatedAttributes = Join-Path $env:RUNNER_TEMP 'ssrs-web-release-empty-attributes'
          [IO.File]::WriteAllBytes($isolatedConfig, [byte[]]@())
          [IO.File]::WriteAllBytes($isolatedAttributes, [byte[]]@())
          $settings = @(
            'GIT_CONFIG_NOSYSTEM=1',
            'GIT_ATTR_NOSYSTEM=1',
            "GIT_CONFIG_GLOBAL=$isolatedConfig",
            'GIT_CONFIG_COUNT=3',
            'GIT_CONFIG_KEY_0=core.autocrlf',
            'GIT_CONFIG_VALUE_0=false',
            'GIT_CONFIG_KEY_1=core.eol',
            'GIT_CONFIG_VALUE_1=lf',
            'GIT_CONFIG_KEY_2=core.attributesFile',
            "GIT_CONFIG_VALUE_2=$isolatedAttributes",
            'GIT_NO_REPLACE_OBJECTS=1',
            'GIT_NO_LAZY_FETCH=1'
          )
          [IO.File]::AppendAllText($env:GITHUB_ENV, ($settings -join [Environment]::NewLine) + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact source bytes before any repository script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-GuardGit {
            param([string] $Root, [string[]] $Arguments)
            $start = [Diagnostics.ProcessStartInfo]::new()
            $gitCommand = Get-Command git -CommandType Application -ErrorAction Stop | Select-Object -First 1
            $gitExecutable = [IO.Path]::GetFullPath($gitCommand.Source)
            $repositoryPrefix = $Root.TrimEnd([IO.Path]::DirectorySeparatorChar, [IO.Path]::AltDirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar
            if ($gitExecutable.StartsWith($repositoryPrefix, [StringComparison]::OrdinalIgnoreCase)) { throw 'Release.ExactSource.GitExecutableUntrusted' }
            $start.FileName = $gitExecutable
            $start.WorkingDirectory = $Root
            $start.UseShellExecute = $false
            $start.CreateNoWindow = $true
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            foreach ($name in @($start.Environment.Keys)) {
              if ($name.StartsWith('GIT_', [StringComparison]::OrdinalIgnoreCase)) { [void]$start.Environment.Remove($name) }
            }
            $start.Environment['GIT_CONFIG_NOSYSTEM'] = '1'
            $start.Environment['GIT_ATTR_NOSYSTEM'] = '1'
            $start.Environment['GIT_CONFIG_COUNT'] = '1'
            $start.Environment['GIT_CONFIG_KEY_0'] = 'core.attributesFile'
            $start.Environment['GIT_CONFIG_VALUE_0'] = Join-Path $env:RUNNER_TEMP 'ssrs-web-release-empty-attributes'
            $start.Environment['GIT_CONFIG_GLOBAL'] = Join-Path $env:RUNNER_TEMP 'ssrs-web-release-empty-gitconfig'
            $start.Environment['GIT_NO_REPLACE_OBJECTS'] = '1'
            $start.Environment['GIT_NO_LAZY_FETCH'] = '1'
            $start.Environment['GIT_OPTIONAL_LOCKS'] = '0'
            $start.Environment['GIT_TERMINAL_PROMPT'] = '0'
            $gitDir = Join-Path $Root '.git'
            if ([IO.Directory]::Exists($gitDir)) {
              $start.Environment['GIT_INDEX_FILE'] = Join-Path $gitDir 'index'
              $gitPrefix = @('-C', $Root, '--git-dir', $gitDir, '--work-tree', $Root)
            } else {
              $gitPrefix = @('-C', $Root)
            }
            foreach ($argument in $gitPrefix + @('--no-replace-objects', '-c', 'core.fsmonitor=false', '-c', 'core.untrackedCache=false') + $Arguments) {
              $start.ArgumentList.Add([string]$argument)
            }
            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $start
            $memory = [IO.MemoryStream]::new()
            try {
              if (-not $process.Start()) { throw 'Release.ExactSource.GitUnavailable' }
              $stderrTask = $process.StandardError.ReadToEndAsync()
              $process.StandardOutput.BaseStream.CopyTo($memory)
              $process.WaitForExit()
              $null = $stderrTask.GetAwaiter().GetResult()
              if ($process.ExitCode -ne 0) { throw 'Release.ExactSource.GitCommandFailed' }
              return ,$memory.ToArray()
            } catch {
              if ($_.Exception.Message -like 'Release.ExactSource.*') { throw }
              throw 'Release.ExactSource.GitCommandFailed'
            } finally { $memory.Dispose(); $process.Dispose() }
          }
          function Read-GuardGitText {
            param([AllowEmptyCollection()][byte[]] $Bytes)
            try { return [Text.UTF8Encoding]::new($false, $true).GetString($Bytes).TrimEnd([char]13, [char]10) }
            catch { throw 'Release.ExactSource.GitOutputInvalid' }
          }
          function Read-GuardRecords {
            param([AllowEmptyCollection()][byte[]] $Bytes)
            $records = [Collections.Generic.List[string]]::new()
            $utf8 = [Text.UTF8Encoding]::new($false, $true)
            $start = 0
            for ($index = 0; $index -lt $Bytes.Length; $index++) {
              if ($Bytes[$index] -eq 0) {
                if ($index -eq $start) { throw 'Release.ExactSource.GitOutputInvalid' }
                try { $records.Add($utf8.GetString($Bytes, $start, $index - $start)) }
                catch { throw 'Release.ExactSource.GitOutputInvalid' }
                $start = $index + 1
              }
            }
            if ($start -ne $Bytes.Length) { throw 'Release.ExactSource.GitOutputInvalid' }
            return ,$records.ToArray()
          }
          function Get-GuardBlobHash {
            param([string] $Path, [string] $ObjectFormat)
            $stream = $null
            $hash = $null
            try {
              $algorithm = if ($ObjectFormat -ceq 'sha1') { [Security.Cryptography.HashAlgorithmName]::SHA1 }
                elseif ($ObjectFormat -ceq 'sha256') { [Security.Cryptography.HashAlgorithmName]::SHA256 }
                else { throw 'Release.ExactSource.ObjectFormatUnsupported' }
              $stream = [IO.File]::OpenRead($Path)
              $hash = [Security.Cryptography.IncrementalHash]::CreateHash($algorithm)
              $hash.AppendData([Text.Encoding]::ASCII.GetBytes('blob ' + $stream.Length))
              $hash.AppendData([byte[]]@(0))
              $buffer = [byte[]]::new(65536)
              while (($read = $stream.Read($buffer, 0, $buffer.Length)) -gt 0) { $hash.AppendData($buffer, 0, $read) }
              return [Convert]::ToHexString($hash.GetHashAndReset()).ToLowerInvariant()
            } finally { if ($hash) { $hash.Dispose() }; if ($stream) { $stream.Dispose() } }
          }
          function Test-GuardGeneratedPath {
            param([string] $RelativePath, [Collections.Generic.HashSet[string]] $AllowedRoots)
            $value = $RelativePath.TrimEnd('/')
            foreach ($root in $AllowedRoots) {
              if ($value.Equals($root, [StringComparison]::OrdinalIgnoreCase) -or $value.StartsWith($root + '/', [StringComparison]::OrdinalIgnoreCase)) { return $true }
            }
            return $false
          }
          $root = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd([IO.Path]::DirectorySeparatorChar, [IO.Path]::AltDirectorySeparatorChar)
          $commit = $env:GITHUB_SHA
          if ($commit -cnotmatch '^[a-f0-9]{40}$') { throw 'Release.ExactSource.CommitInvalid' }
          $gitDir = Join-Path $root '.git'
          if (-not [IO.Directory]::Exists($gitDir) -or ([IO.File]::GetAttributes($root) -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              ([IO.File]::GetAttributes($gitDir) -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Release.ExactSource.RepositoryMetadataInvalid' }
          foreach ($name in @('config', 'index', 'HEAD')) {
            $metadataPath = Join-Path $gitDir $name
            if (-not [IO.File]::Exists($metadataPath) -or ([IO.File]::GetAttributes($metadataPath) -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'Release.ExactSource.RepositoryMetadataInvalid'
            }
          }
          $actualGitDir = Read-GuardGitText (Invoke-GuardGit $root @('rev-parse', '--absolute-git-dir'))
          if ([IO.Path]::GetFullPath($actualGitDir).TrimEnd([IO.Path]::DirectorySeparatorChar, [IO.Path]::AltDirectorySeparatorChar) -cne $gitDir -or
              [IO.File]::Exists((Join-Path $gitDir 'objects/info/alternates'))) { throw 'Release.ExactSource.RepositoryMetadataInvalid' }
          if ((Read-GuardGitText (Invoke-GuardGit $root @('rev-parse', '--verify', 'HEAD'))) -cne $commit) { throw 'Release.ExactSource.CommitMismatch' }
          $format = Read-GuardGitText (Invoke-GuardGit $root @('rev-parse', '--show-object-format'))
          if ($format -cne 'sha1' -and $format -cne 'sha256') { throw 'Release.ExactSource.ObjectFormatUnsupported' }
          $tree = [Collections.Generic.Dictionary[string, object]]::new([StringComparer]::Ordinal)
          $paths = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($record in (Read-GuardRecords (Invoke-GuardGit $root @('ls-tree', '-r', '-z', '--full-tree', $commit)))) {
            $tab = $record.IndexOf([char]9)
            if ($tab -le 0) { throw 'Release.ExactSource.GitOutputInvalid' }
            $metadata = $record.Substring(0, $tab).Split(' ')
            $relative = $record.Substring($tab + 1)
            if ($metadata.Count -ne 3 -or $metadata[1] -cne 'blob' -or $metadata[0] -cnotin @('100644', '100755') -or
                $metadata[2] -cnotmatch '^[a-f0-9]{40}([a-f0-9]{24})?$' -or [string]::IsNullOrEmpty($relative) -or
                $relative.StartsWith('/') -or $relative.Contains('\') -or $relative -match '(^|/)(\.|\.\.)(/|$)' -or
                $relative -match '[\x00-\x1f<>:"|?*]' -or $relative -match '(^|/)[^/]*[ .](/|$)' -or
                $relative -match '(^|/)(?i:CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(\.[^/]*)?(/|$)') { throw 'Release.ExactSource.UnsupportedTreeEntry' }
            $full = [IO.Path]::GetFullPath((Join-Path $root ($relative.Replace('/', [IO.Path]::DirectorySeparatorChar))))
            $prefix = $root.TrimEnd([IO.Path]::DirectorySeparatorChar, [IO.Path]::AltDirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar
            if (-not $full.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase) -or -not $paths.Add($full) -or $tree.ContainsKey($relative)) {
              throw 'Release.ExactSource.UnsupportedTreeEntry'
            }
            $tree.Add($relative, [pscustomobject]@{ mode = $metadata[0]; objectId = $metadata[2]; fullPath = $full })
          }
          if ($tree.Count -eq 0) { throw 'Release.ExactSource.EmptyTree' }
          $index = [Collections.Generic.Dictionary[string, object]]::new([StringComparer]::Ordinal)
          foreach ($record in (Read-GuardRecords (Invoke-GuardGit $root @('ls-files', '--stage', '-z')))) {
            $tab = $record.IndexOf([char]9)
            if ($tab -le 0) { throw 'Release.ExactSource.GitOutputInvalid' }
            $metadata = $record.Substring(0, $tab).Split(' ')
            $relative = $record.Substring($tab + 1)
            if ($metadata.Count -ne 3 -or $metadata[2] -cne '0' -or $metadata[0] -cnotin @('100644', '100755') -or
                $metadata[1] -cnotmatch '^[a-f0-9]{40}([a-f0-9]{24})?$' -or $index.ContainsKey($relative)) { throw 'Release.ExactSource.IndexMismatch' }
            $index.Add($relative, [pscustomobject]@{ mode = $metadata[0]; objectId = $metadata[1] })
          }
          if ($index.Count -ne $tree.Count) { throw 'Release.ExactSource.IndexMismatch' }
          foreach ($relative in $tree.Keys) {
            if (-not $index.ContainsKey($relative) -or $index[$relative].mode -cne $tree[$relative].mode -or $index[$relative].objectId -cne $tree[$relative].objectId) {
              throw 'Release.ExactSource.IndexMismatch'
            }
          }
          foreach ($relative in $tree.Keys) {
            $entry = $tree[$relative]
            $current = $root
            $components = $relative.Split('/')
            for ($part = 0; $part -lt $components.Length - 1; $part++) {
              $current = Join-Path $current $components[$part]
              if (-not [IO.Directory]::Exists($current) -or ([IO.File]::GetAttributes($current) -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw 'Release.ExactSource.WorkingTreeEntryInvalid'
              }
            }
            if (-not [IO.File]::Exists($entry.fullPath) -or ([IO.File]::GetAttributes($entry.fullPath) -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'Release.ExactSource.WorkingTreeEntryInvalid'
            }
            if ((Get-GuardBlobHash $entry.fullPath $format) -cne $entry.objectId) { throw 'Release.ExactSource.WorkingTreeBlobMismatch' }
          }
          $untracked = Read-GuardRecords (Invoke-GuardGit $root @('ls-files', '--others', '-z'))
          $allowedGeneratedRoots = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($path in @('artifacts', 'node_modules')) { [void]$allowedGeneratedRoots.Add($path) }
          foreach ($project in @($tree.Keys | Where-Object { $_ -cmatch '(^|/)[^/]+\.csproj$' })) {
            $separator = $project.LastIndexOf('/')
            $projectDirectory = if ($separator -ge 0) { $project.Substring(0, $separator) } else { '' }
            foreach ($path in @('bin', 'obj', 'TestResults')) {
              $generated = if ($projectDirectory) { $projectDirectory + '/' + $path } else { $path }
              [void]$allowedGeneratedRoots.Add($generated)
            }
          }
          foreach ($relative in $untracked) {
            if (-not (Test-GuardGeneratedPath $relative $allowedGeneratedRoots)) { throw 'Release.ExactSource.UntrackedOrIgnoredSourceAmbiguity' }
          }
          Write-Output "Exact source bytes verified for $($tree.Count) tracked files."
      - name: Run shared exact-source verification
        shell: pwsh
        run: ./scripts/release/Test-ExactSourceBytes.ps1 -RepositoryRoot $env:GITHUB_WORKSPACE -Commit $env:GITHUB_SHA
      - name: Validate exact supported tag and source eligibility
        env:
          SSRS_ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/release/TagRelease.Common.ps1
          $tag=Get-SsrsReleaseTag $env:GITHUB_REF_NAME
          $target=Resolve-SsrsTag $tag.tag
          if ($target.sourceCommit -cne $env:GITHUB_SHA) { throw 'Release.Tag.SourceMismatch' }
          $null=Get-SsrsSourceEligibility $tag $target.sourceCommit $env:GITHUB_EVENT_NAME
          "RELEASE_TAG_OBJECT=$($target.objectSha)" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Use fresh job-local SDK
        run: '"DOTNET_INSTALL_DIR=$env:RUNNER_TEMP\ssrs-dotnet" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append'
      - name: Authenticate job-local packaging PowerShell
        run: ./scripts/release/Get-BuildPowerShell.ps1 -Destination "$env:RUNNER_TEMP/ssrs-pwsh"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.303
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Locked dependency and regression verification
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore SsrsPortal.slnx --locked-mode
          if ($LASTEXITCODE) { throw 'Release.RestoreFailed' }
          dotnet build SsrsPortal.slnx -c Release --no-restore
          if ($LASTEXITCODE) { throw 'Release.BuildFailed' }
          dotnet test SsrsPortal.slnx -c Release --no-build --logger 'console;verbosity=minimal'
          if ($LASTEXITCODE) { throw 'Release.TestsFailed' }
          npm ci
          if ($LASTEXITCODE) { throw 'Release.NpmRestoreFailed' }
          npm audit --audit-level=low
          if ($LASTEXITCODE) { throw 'Release.NpmAuditFailed' }
          dotnet publish src/SsrsPortal/SsrsPortal.csproj -c Release --no-restore --output artifacts/ordinary-release-publish
          if ($LASTEXITCODE) { throw 'Release.OrdinaryPublishFailed' }
          ./scripts/release/Export-ThirdPartyNotices.ps1 -PublishDirectory artifacts/ordinary-release-publish
          ./scripts/release/Test-ReleasePackaging.ps1 -OrdinaryPublishDirectory artifacts/ordinary-release-publish
          ./scripts/release/Test-TagDeployment.ps1
          ./scripts/release/Test-ReleaseArchive.ps1
          ./scripts/release/Test-DevDeployment.ps1
          node scripts/check-generated-artifacts.cjs
          if ($LASTEXITCODE) { throw 'Release.GeneratedArtifactPolicyFailed' }
      - name: Build and independently verify release
        id: build
        env:
          SELECTED_COMMIT: ${{ github.sha }}
          # This repository's pinned toolkit is public. PR-tag code gets no secret.
          TOOLKIT_READ_TOKEN: ''
        run: ./scripts/release/Build-PortalRelease.ps1 -SourceCommit $env:SELECTED_COMMIT
      - name: Recheck tag identity before publication
        env:
          SSRS_ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/release/TagRelease.Common.ps1
          $target=Resolve-SsrsTag $env:GITHUB_REF_NAME
          if ($target.sourceCommit -cne $env:GITHUB_SHA -or $target.objectSha -cne $env:RELEASE_TAG_OBJECT) { throw 'Release.Tag.TagMoved' }
      - name: Retain exact release bytes
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ssrs-web-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.build.outputs.artifact-directory }}/release.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: false
      - name: Bind transport identity to the inner release
        env:
          BUILD_EVIDENCE: ${{ steps.build.outputs.build-evidence }}
          RELEASE_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          RELEASE_TRANSPORT_SHA256: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          $null=./scripts/release/Write-ReleaseProvenance.ps1 -BuildEvidencePath $env:BUILD_EVIDENCE -ArtifactId ([long]$env:RELEASE_ARTIFACT_ID) -ArtifactTransportSha256 $env:RELEASE_TRANSPORT_SHA256 -OutputPath "$env:RUNNER_TEMP/release-provenance.json"
      - name: Retain separate producer provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ssrs-web-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-provenance.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
      - name: Retain separately administered setup tooling
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ssrs-web-administrative-setup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.build.outputs.administrative-archive }}
          if-no-files-found: error
          retention-days: 30
          overwrite: false
