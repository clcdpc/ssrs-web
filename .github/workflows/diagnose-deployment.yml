name: Validate SSRS Web deployment prerequisites
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  github:
    if: github.repository == 'clcdpc/ssrs-web'
    uses: clcdpc/clc-deployment/.github/workflows/check-github-setup.yml@33777ec2c4cfc70c86c102f5cb38502d0a8f4f1d
    with:
      application_id: ssrs-web
      channel: DEV
      integration_branch: master
      check_release_immutability: true
