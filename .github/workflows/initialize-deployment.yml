name: Initialize Deployment Host
on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options: [DEV, Production]
      operation:
        description: Host operation
        required: true
        type: choice
        default: Preview
        options: [Preview, Initialize, Validate]
      site-name:
        description: IIS site name (Preview and Initialize)
        type: string
      pool-name:
        description: IIS application pool name (Preview and Initialize)
        type: string
      readiness-uri:
        description: HTTPS readiness URI ending in /health/ready (Preview and Initialize)
        type: string
permissions: {}
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target-id: ${{ steps.admission.outputs.target-id }}
    steps:
      - name: Admit only the protected master workflow
        id: admission
        shell: bash
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
          TARGET: ${{ inputs.target }}
          OPERATION: ${{ inputs.operation }}
          SITE_NAME: ${{ inputs.site-name }}
          POOL_NAME: ${{ inputs.pool-name }}
          READINESS_URI: ${{ inputs.readiness-uri }}
        run: |
          if [[ "$GITHUB_REPOSITORY" != 'clcdpc/ssrs-web' ||
                "$GITHUB_EVENT_NAME" != 'workflow_dispatch' ||
                "$GITHUB_REF" != 'refs/heads/master' ||
                "$REF_PROTECTED" != 'true' ||
                "$GITHUB_WORKFLOW_REF" != 'clcdpc/ssrs-web/.github/workflows/initialize-deployment.yml@refs/heads/master' ||
                "$GITHUB_WORKFLOW_SHA" != "$GITHUB_SHA" ]]; then
            echo '::error::Select the protected master branch of clcdpc/ssrs-web.'
            exit 1
          fi
          case "$TARGET" in
            DEV) target_id=ssrs-web-dev ;;
            Production) target_id=ssrs-web-production ;;
            *) echo '::error::Select DEV or Production.'; exit 1 ;;
          esac
          case "$OPERATION" in
            Preview|Initialize)
              if [[ -z "${SITE_NAME//[[:space:]]/}" || -z "${POOL_NAME//[[:space:]]/}" || -z "${READINESS_URI//[[:space:]]/}" ]]; then
                echo '::error::Preview and Initialize require a site name, pool name and HTTPS readiness URI.'
                exit 1
              fi
              ;;
            Validate) ;;
            *) echo '::error::Select Preview, Initialize or Validate.'; exit 1 ;;
          esac
          echo "target-id=$target_id" >> "$GITHUB_OUTPUT"

  host:
    needs: admit
    # The runner group must also restrict access to this master workflow
    # and the pinned upstream reusable deployment workflow.
    environment: ${{ needs.admit.outputs.target-id }}
    runs-on: [self-hosted, Windows, X64, "${{ needs.admit.outputs.target-id }}"]
    timeout-minutes: 15
    concurrency:
      group: clc-application-${{ github.repository }}-${{ needs.admit.outputs.target-id }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: clcdpc/clc-deployment
          ref: 7fcfd03da044655b57fe47d55e234571bef035bd
          persist-credentials: false
      - name: Run the requested upstream host operation
        shell: pwsh
        env:
          CLC_TARGET_ID: ${{ needs.admit.outputs.target-id }}
          CLC_OPERATION: ${{ inputs.operation }}
          CLC_SITE_NAME: ${{ inputs.site-name }}
          CLC_POOL_NAME: ${{ inputs.pool-name }}
          CLC_READINESS_URI: ${{ inputs.readiness-uri }}
          CLC_RUNTIME_ACCOUNT: ${{ vars.CLC_RUNTIME_ACCOUNT }}
        run: |
          $version = $PSVersionTable.PSVersion
          if ($version.Major -ne 7 -or $version -lt [semver]'7.6.6' -or $version.PreReleaseLabel) {
            throw 'The runner service PATH must select stable PowerShell 7.6.6 or later within 7.x.'
          }
          Import-Module ./src/Clc.Deployment/Clc.Deployment.psd1
          $target = @{ ApplicationId = 'ssrs-web'; TargetId = $env:CLC_TARGET_ID }
          if ($env:CLC_OPERATION -ceq 'Validate' -and [string]::IsNullOrWhiteSpace($env:CLC_RUNTIME_ACCOUNT)) {
            throw 'Set CLC_RUNTIME_ACCOUNT in the selected GitHub environment before validation.'
          }
          try {
            if ($env:CLC_OPERATION -ceq 'Validate') {
              $result = Test-ClcDeploymentHost @target -ExpectedRuntimeAccount $env:CLC_RUNTIME_ACCOUNT -RuntimeEnvironment Production
              $success = $result.ready
            } else {
              $result = Initialize-ClcDeploymentHost @target -Operation $env:CLC_OPERATION `
                  -SiteName $env:CLC_SITE_NAME -ApplicationPoolName $env:CLC_POOL_NAME -ReadinessUri $env:CLC_READINESS_URI
              $success = $result.status -cin @('Preview', 'InitializedNeedsConfiguration', 'AlreadyInitialized')
            }
          } catch {
            $code = $_.FullyQualifiedErrorId.Split(',')[0]
            $message = 'Host operation failed. Inspect the local host and the commissioning guide.'
            if ($code -cmatch '^Clc\.[A-Za-z0-9]+$') {
              $message = "Host operation failed ($code). Inspect the local host and the commissioning guide."
            }
            @('## Host operation failed', '', $message) >> $env:GITHUB_STEP_SUMMARY
            throw $message
          }
          $summary = @("## $env:CLC_OPERATION · $env:CLC_TARGET_ID", '', "Status: $($result.status)")
          if ($result.status -ceq 'Preview') {
            # Report relative paths and the intended IIS settings without raw host evidence.
            $rootName = [IO.Path]::GetFileName($result.root)
            $paths = $result.planned | Where-Object { [IO.Path]::IsPathFullyQualified($_) } | ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($result.root, $_)
              if ($relative -ceq '.') { $rootName } else { Join-Path $rootName $relative }
            }
            $summary += @('', 'Under native ProgramData:', '') + @($paths | ForEach-Object { "- $_" })
            $summary += @('', 'Create the requested IIS site and pool stopped, with automatic startup disabled and zero bindings.',
              'Pool settings: No Managed Code, Integrated, x64, one worker, Load User Profile, no overlapping recycling.')
          }
          if ($env:CLC_OPERATION -ceq 'Validate' -and $result.siteState -and $result.poolState) {
            $summary += "IIS site: $($result.siteState). Pool: $($result.poolState)."
          }
          foreach ($finding in $result.findings) {
            $summary += "- $($finding.code): $($finding.message)"
          }
          foreach ($action in $result.administratorActions) {
            $summary += "- $action"
          }
          $summary | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Output $summary
          if (-not $success) { throw "Host operation returned $($result.status). Review the findings above." }
